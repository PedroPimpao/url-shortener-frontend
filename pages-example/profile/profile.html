<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Link Precision - My Profile</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f6fa;
    color: #1f2430;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f5f6fa;
    padding: 20px 40px;
    border-bottom: 1px solid #e5e7ef;
  }
  .logo {
    font-size: 26px;
    font-weight: 800;
    color: #4338ca;
  }
  nav {
    display: flex;
    gap: 32px;
    align-items: center;
  }
  nav a {
    text-decoration: none;
    color: #6b7280;
    font-size: 15px;
  }
  nav a.active {
    color: #4338ca;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 6px;
  }
  .logout-link {
    color: #4f46e5;
    font-weight: 600;
    text-decoration: none;
    font-size: 15px;
  }

  main {
    max-width: 1275px;
    margin: 0 auto;
    padding: 32px 40px 60px;
  }

  .page-title h1 {
    font-size: 34px;
    font-weight: 800;
    margin: 0 0 6px;
  }
  .page-title p {
    color: #6b7280;
    font-size: 15px;
    margin: 0 0 28px;
  }

  .content-grid {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .left-col {
    flex: 1.7;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .right-col {
    flex: 1;
  }

  .card {
    background: #fff;
    border: 1px solid #e5e7ef;
    border-radius: 12px;
    padding: 28px 32px;
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 20px;
  }
  .card-title .icon { color: #4f46e5; font-size: 17px; }

  .field {
    margin-bottom: 18px;
  }
  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #d8dae5;
    border-radius: 8px;
    font-size: 14px;
    color: #1f2430;
    background: #fff;
    outline: none;
  }

  input::placeholder { color: #b0b3c0; }

  .field-row {
    display: flex;
    gap: 16px;
  }
  .field-row .field { flex: 1; }

  /* Profile summary card */
  .profile-summary {
    background: #e6e9fb;
    border: 1px solid #dcdff8;
    border-radius: 12px;
    padding: 32px 28px;
    text-align: center;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #5850ec;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  .profile-summary h3 {
    font-size: 19px;
    margin: 0 0 4px;
  }
  .profile-summary .plan {
    font-size: 14px;
    color: #6b7280;
    margin: 0 0 20px;
  }

  .stats-divider {
    border-top: 1px solid #cfd3f2;
    padding-top: 16px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 10px;
    text-align: left;
  }
  .stat-row:last-child { margin-bottom: 0; }
  .stat-row .label { color: #4a4f5c; }
  .stat-row .value { font-weight: 700; }

  .actions-row {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 24px;
  }

  .btn {
    padding: 11px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .btn-cancel {
    background: #fff;
    border-color: #d8dae5;
    color: #1f2430;
  }

  .btn-save {
    background: #4f46e5;
    color: #fff;
  }
  .btn-save:hover { background: #4338ca; }
</style>
</head>
<body>

<header>
  <div class="logo">Link Precision</div>
  <nav>
    <a href="#">Dashboard</a>
    <a href="#" class="active">My Profile</a>
  </nav>
  <a href="#" class="logout-link">Logout</a>
</header>

<main>
  <div class="page-title">
    <h1>My Profile</h1>
    <p>Manage your account settings and preferences.</p>
  </div>

  <div class="content-grid">
    <div class="left-col">
      <section class="card">
        <h2 class="card-title"><span class="icon">👤</span> Profile Details</h2>
        <div class="field">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" value="Alex Morgan">
        </div>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" value="alex.morgan@example.com">
        </div>
      </section>

      <section class="card">
        <h2 class="card-title"><span class="icon">🔒</span> Change Password</h2>
        <div class="field">
          <label for="current-password">Current Password</label>
          <input type="password" id="current-password" placeholder="">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" placeholder="">
          </div>
          <div class="field">
            <label for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" placeholder="">
          </div>
        </div>
      </section>
    </div>

    <div class="right-col">
      <div class="profile-summary">
        <div class="avatar">AM</div>
        <h3>Alex Morgan</h3>
        <p class="plan">Pro Plan User</p>
        <div class="stats-divider">
          <div class="stat-row">
            <span class="label">Links Created</span>
            <span class="value">1,204</span>
          </div>
          <div class="stat-row">
            <span class="label">Total Clicks</span>
            <span class="value">45.2k</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="actions-row">
    <button class="btn btn-cancel">Cancel</button>
    <button class="btn btn-save">Save Changes</button>
  </div>
</main>

</body>
</html>
